<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FBF7F9" />
<title>My PCOS Journey — Wellness &amp; Weight-Loss Tracker</title>
<style>
  :root {
    --plum: #3D2B44;
    --plum-soft: #6B5873;
    --plum-faint: #8B7B92;
    --white: #FFFFFF;
    --canvas: #FBF7F9;
    --surface: #FFFFFF;
    --surface-2: #F8F1F5;
    --line: rgba(61,43,68,0.08);
    --line-strong: rgba(61,43,68,0.16);

    --blush: #F6DCE7;
    --blush-soft: #FBEEF3;
    --blush-500: #DE8FB4;
    --blush-600: #C9759F;

    --lavender: #E7E1F7;
    --lavender-soft: #F4F0FC;
    --lavender-500: #9A8AD6;
    --lavender-600: #7F6EC0;

    --sage: #DCEBDA;
    --sage-soft: #F1F7EF;
    --sage-500: #7FA876;
    --sage-600: #648C5C;

    --amber: #C08A4A;

    --r-xs: 10px; --r-sm: 14px; --r-md: 18px; --r-lg: 24px; --r-xl: 30px;
    --shadow-sm: 0 1px 3px rgba(61,43,68,0.04), 0 6px 20px rgba(61,43,68,0.05);
    --shadow-md: 0 2px 6px rgba(61,43,68,0.04), 0 14px 34px rgba(61,43,68,0.08);
    --shadow-lg: 0 18px 50px rgba(61,43,68,0.14);
    --tap: 46px;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --nav-h: 72px;
    --maxw: 1180px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font);
    background: var(--canvas);
    color: var(--plum);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  h1, h2, h3, h4, p { margin: 0; }
  button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  a { color: var(--lavender-600); }
  :focus-visible { outline: 3px solid var(--lavender-500); outline-offset: 2px; border-radius: 8px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  /* Layout */
  .app { min-height: 100dvh; }
  .sidebar { display: none; }
  .main {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 18px 16px calc(var(--nav-h) + 40px);
    transition: max-width 0.25s ease;
  }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-mark {
    width: 38px; height: 38px; border-radius: 13px; flex: 0 0 auto;
    background: linear-gradient(145deg, var(--blush), var(--lavender));
    display: grid; place-items: center; color: var(--plum);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.7), 0 2px 8px rgba(222,143,180,0.2);
  }
  .brand-name { font-size: 15.5px; font-weight: 800; letter-spacing: -0.015em; white-space: nowrap; }
  .brand-sub { font-size: 11px; color: var(--plum-faint); letter-spacing: 0.04em; text-transform: uppercase; font-weight: 600; }
  .topbar-right { display: flex; align-items: center; gap: 8px; }

  .view { display: none; animation: fade .28s ease both; }
  .view.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .grid { display: grid; gap: 14px; }
  .stack { display: grid; gap: 14px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row.wrap { flex-wrap: wrap; }
  .spacer { flex: 1; }

  /* Navigation */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-top: 1px solid var(--line);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    display: grid; grid-template-columns: repeat(5, 1fr);
  }
  .tab {
    background: none; border: 0; padding: 7px 2px 5px; border-radius: 14px;
    display: grid; justify-items: center; gap: 3px; color: var(--plum-faint);
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.01em; min-height: var(--tap);
    transition: color .18s ease, background .18s ease;
    position: relative;
  }
  .tab svg { width: 22px; height: 22px; stroke-width: 1.7; transition: transform 0.15s ease; }
  .tab[aria-current="page"] { color: var(--plum); background: var(--blush-soft); }
  .tab[aria-current="page"] svg { color: var(--blush-600); transform: translateY(-1px); }

  /* Cards */
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
    padding: 18px; box-shadow: var(--shadow-sm); transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card.tint-blush { background: linear-gradient(170deg, var(--blush-soft), var(--white) 70%); }
  .card.tint-sage { background: linear-gradient(170deg, var(--sage-soft), var(--white) 70%); }
  .card.tint-lav { background: linear-gradient(170deg, var(--lavender-soft), var(--white) 70%); }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .card-title { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
  .card-sub { font-size: 12.5px; color: var(--plum-faint); margin-top: 2px; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--plum-faint); }

  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700;
    background: var(--surface-2); color: var(--plum-soft); border: 1px solid var(--line);
    white-space: nowrap;
  }
  .pill.sage { background: var(--sage-soft); color: var(--sage-600); border-color: rgba(127,168,118,0.25); }
  .pill.blush { background: var(--blush-soft); color: var(--blush-600); border-color: rgba(222,143,180,0.25); }
  .pill.lav { background: var(--lavender-soft); color: var(--lavender-600); border-color: rgba(154,138,214,0.25); }
  .pill.plum { background: rgba(61,43,68,0.06); color: var(--plum); }
  .pill.plain { background: transparent; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: var(--tap); padding: 0 18px; border-radius: 999px; border: 1px solid transparent;
    font-weight: 700; font-size: 14px; letter-spacing: -0.005em;
    transition: transform .12s ease, box-shadow .18s ease, background .18s ease;
    text-decoration: none;
  }
  .btn:active { transform: scale(0.97); }
  .btn svg { width: 18px; height: 18px; stroke-width: 1.9; }
  .btn-primary { background: var(--plum); color: #fff; box-shadow: 0 8px 20px rgba(61,43,68,0.2); }
  .btn-primary:hover { background: #2f2035; }
  .btn-blush { background: var(--blush-500); color: #47202F; box-shadow: 0 8px 20px rgba(222,143,180,0.28); }
  .btn-blush:hover { background: #d37fa6; }
  .btn-sage { background: var(--sage-500); color: #1C3817; box-shadow: 0 8px 20px rgba(127,168,118,0.28); }
  .btn-sage:hover { background: #719b68; }
  .btn-lav { background: var(--lavender-soft); color: var(--lavender-600); border-color: rgba(154,138,214,0.3); }
  .btn-lav:hover { background: var(--lavender); }
  .btn-soft { background: var(--surface-2); color: var(--plum); border: 1px solid var(--line); }
  .btn-soft:hover { background: #f0e6ec; }
  .btn-ghost { background: transparent; color: var(--plum-soft); }
  .btn-ghost:hover { background: var(--surface-2); color: var(--plum); }
  .btn-danger { background: #FDE8E8; color: #9B1C1C; }
  .btn-danger:hover { background: #fbd5d5; }
  .btn-sm { min-height: 36px; padding: 0 14px; font-size: 13px; }
  .btn-icon { width: 38px; height: 38px; min-height: 38px; padding: 0; border-radius: 999px; }

  /* Hero & Rings */
  .hero { display: flex; align-items: center; gap: 20px; }
  .hero-ring { flex: 0 0 auto; }
  .hero-copy { flex: 1; min-width: 0; }
  .rings-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
  .rings-4 .mini { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .rings-4 .mini .ring-wrap { width: 64px; height: 64px; }
  .rings-4 .mini .ring-lab { font-size: 11.5px; font-weight: 700; color: var(--plum-soft); }

  .ring-wrap { position: relative; display: inline-grid; place-items: center; }
  .ring-wrap svg { transform: rotate(-90deg); display: block; }
  .ring-bg { stroke: rgba(61,43,68,0.08); fill: none; }
  .ring-fg { fill: none; stroke-linecap: round; transition: stroke-dashoffset 0.6s cubic-bezier(0.2, 0.9, 0.3, 1); }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-val { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .ring-lab { font-size: 10px; font-weight: 700; color: var(--plum-faint); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 3px; }

  .bar { height: 8px; border-radius: 999px; background: rgba(61,43,68,0.08); overflow: hidden; }
  .bar span { display: block; height: 100%; border-radius: 999px; background: var(--sage-500); transition: width 0.4s ease; }
  .bar.thin { height: 6px; }
  .bar.blush span { background: var(--blush-500); }
  .bar.lav span { background: var(--lavender-500); }

  /* Stats grid */
  .stats-4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stats-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .stat { background: var(--surface-2); border-radius: var(--r-sm); padding: 12px; border: 1px solid var(--line); }
  .stat-lab { font-size: 11.5px; font-weight: 700; color: var(--plum-faint); display: flex; align-items: center; gap: 5px; }
  .stat-val { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; margin-top: 3px; }
  .stat-val small { font-size: 12px; font-weight: 600; color: var(--plum-faint); margin-left: 2px; }
  .stat-note { font-size: 11px; color: var(--plum-faint); margin-top: 2px; }

  /* Habit checklist item */
  .habit-item {
    display: flex; align-items: center; gap: 12px; padding: 11px 12px;
    border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--line);
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .habit-item.done { background: var(--sage-soft); border-color: rgba(127,168,118,0.22); }
  .habit-check-btn {
    width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line-strong);
    background: #fff; display: grid; place-items: center; flex: 0 0 auto;
    color: transparent; transition: all 0.15s ease; padding: 0; cursor: pointer;
  }
  .habit-check-btn.checked {
    background: var(--sage-500); border-color: var(--sage-500); color: #fff;
    box-shadow: 0 2px 6px rgba(127,168,118,0.35);
  }
  .habit-check-btn svg { width: 16px; height: 16px; stroke-width: 2.5; }
  .habit-main { flex: 1; min-width: 0; }
  .habit-title { font-size: 14px; font-weight: 600; }
  .habit-item.done .habit-title { color: var(--plum); font-weight: 700; }
  .habit-sub { font-size: 11.5px; color: var(--plum-faint); margin-top: 2px; display: flex; align-items: center; gap: 4px; }
  .habit-sub.highlight { color: var(--sage-600); font-weight: 600; }

  /* Stepper */
  .stepper { display: inline-flex; align-items: center; gap: 8px; background: var(--surface-2); padding: 4px 6px; border-radius: 999px; border: 1px solid var(--line); }
  .stepper button { width: 32px; height: 32px; border-radius: 999px; border: 0; background: #fff; display: grid; place-items: center; box-shadow: 0 1px 3px rgba(61,43,68,0.08); color: var(--plum); }
  .stepper button:disabled { opacity: 0.4; cursor: not-allowed; }
  .stepper .v { font-size: 14px; font-weight: 700; padding: 0 6px; min-width: 48px; text-align: center; }

  /* Switch */
  .switch { position: relative; display: inline-block; width: 44px; height: 26px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track { position: absolute; inset: 0; background: rgba(61,43,68,0.14); border-radius: 999px; transition: background 0.2s ease; }
  .switch .thumb { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: #fff; border-radius: 999px; transition: transform 0.2s ease; box-shadow: 0 1px 4px rgba(61,43,68,0.18); }
  .switch input:checked + .track { background: var(--sage-500); }
  .switch input:checked + .track + .thumb, .switch input:checked ~ .thumb { transform: translateX(18px); }
  .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 8px 0; }
  .switch-title { font-size: 14px; font-weight: 600; }
  .switch-desc { font-size: 12px; color: var(--plum-faint); margin-top: 2px; }

  /* Meal Plan styling */
  .daytabs { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 14px; }
  .daytab {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm);
    padding: 8px 2px; text-align: center; display: grid; justify-items: center; gap: 2px;
    color: var(--plum-soft); transition: all 0.15s ease;
  }
  .daytab.today { border-color: var(--blush-500); }
  .daytab[aria-selected="true"] { background: var(--plum); color: #fff; border-color: var(--plum); box-shadow: 0 4px 14px rgba(61,43,68,0.18); }
  .daytab .dn { font-size: 11px; font-weight: 700; text-transform: uppercase; }
  .daytab .dot { width: 5px; height: 5px; border-radius: 999px; background: var(--sage-500); margin-top: 2px; }
  .daytab[aria-selected="true"] .dot { background: #fff; }

  .filter-bar { display: inline-flex; background: var(--surface-2); padding: 3px; border-radius: 999px; border: 1px solid var(--line); gap: 2px; }
  .filter-btn { background: none; border: 0; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--plum-soft); transition: all 0.15s ease; }
  .filter-btn[aria-pressed="true"] { background: #fff; color: var(--plum); font-weight: 700; box-shadow: 0 1px 4px rgba(61,43,68,0.08); }

  /* Meal card design: simplified, clean, personal food diary */
  .meal {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
    padding: 16px; transition: all 0.18s ease; display: flex; flex-direction: column; gap: 10px;
  }
  .meal.done { background: var(--sage-soft); border-color: rgba(127,168,118,0.3); }
  .meal-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .meal-cat-title { font-size: 14px; font-weight: 800; color: var(--plum); letter-spacing: -0.01em; text-transform: uppercase; }
  .meal-time-badge { font-size: 11.5px; font-weight: 600; color: var(--plum-faint); }
  .meal-body { display: flex; flex-direction: column; gap: 4px; }
  .meal-food-entry { font-size: 16px; font-weight: 700; color: var(--plum); letter-spacing: -0.01em; }
  .meal-portion-text { font-size: 13px; color: var(--plum-soft); }
  .meal-notes-text { font-size: 12.5px; color: var(--plum-soft); background: rgba(255,255,255,0.7); padding: 6px 10px; border-radius: var(--r-xs); border: 1px solid var(--line); margin-top: 4px; }
  .meal-actions-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

  /* Separate suggestion box */
  .card-suggestion {
    padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2);
    border: 1px dashed rgba(61,43,68,0.18); font-size: 12px; line-height: 1.45;
  }

  /* Walking tracker timer */
  .timer { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 800; letter-spacing: -0.02em; }
  .timer.lg { font-size: 46px; line-height: 1; color: var(--plum); }
  .timer.md { font-size: 26px; line-height: 1; }

  /* Segmented control */
  .seg { display: inline-flex; background: var(--surface-2); padding: 3px; border-radius: 999px; border: 1px solid var(--line); }
  .seg button { background: none; border: 0; padding: 6px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--plum-soft); }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--plum); font-weight: 700; box-shadow: 0 1px 4px rgba(61,43,68,0.08); }

  /* 7-day chart */
  .chart { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; height: 160px; padding: 18px 4px 6px; }
  .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; gap: 4px; }
  .chart .track { width: 100%; max-width: 28px; height: 110px; background: rgba(61,43,68,0.06); border-radius: 8px; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; position: relative; }
  .chart .fill-lunch { width: 100%; background: var(--sage-500); border-radius: 0; transition: height 0.4s ease; }
  .chart .fill-eve { width: 100%; background: var(--lavender-500); border-radius: 8px 8px 0 0; transition: height 0.4s ease; }
  .chart .col.today .track { box-shadow: 0 0 0 2px var(--blush-600); }
  .chart .cv { font-size: 10px; font-weight: 700; color: var(--plum-soft); }
  .chart .cd { font-size: 11px; font-weight: 700; color: var(--plum-faint); }

  /* Habit matrix */
  .habit-days { display: grid; grid-template-columns: 140px repeat(7, 1fr); gap: 4px; font-size: 11px; font-weight: 700; color: var(--plum-faint); text-align: center; }
  .habit-grid { display: grid; gap: 6px; }
  .habit-row { display: grid; grid-template-columns: 140px repeat(7, 1fr); gap: 4px; align-items: center; }
  .habit-row .hl { font-size: 12.5px; font-weight: 600; color: var(--plum); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .habit-dot { width: 22px; height: 22px; border-radius: 7px; margin: 0 auto; display: grid; place-items: center; }
  .habit-dot.on { background: var(--sage-soft); color: var(--sage-600); border: 1.5px solid rgba(127,168,118,0.4); }
  .habit-dot.miss { background: var(--surface-2); border: 1px dashed var(--line-strong); }
  .habit-dot.future { opacity: 0.25; background: var(--surface-2); }
  .habit-dot svg { width: 12px; height: 12px; stroke-width: 2.5; }

  /* Achievements */
  .ach { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .ach:last-child { border-bottom: 0; }
  .ach-icon { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--plum-soft); flex: 0 0 auto; }
  .ach.earned .ach-icon { background: var(--sage-soft); color: var(--sage-600); }
  .ach-title { font-size: 13.5px; font-weight: 700; }
  .ach-sub { font-size: 11.5px; color: var(--plum-faint); }

  /* Modal Sheet */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 100; background: rgba(30, 16, 36, 0.45);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display: grid; place-items: end center; animation: fadeIn .2s ease;
  }
  .sheet {
    background: #fff; width: 100%; max-width: 520px; border-radius: 26px 26px 0 0;
    padding: 22px 20px calc(24px + env(safe-area-inset-bottom));
    box-shadow: var(--shadow-lg); max-height: 90dvh; overflow-y: auto;
    animation: slideUp .24s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0.5; } to { transform: none; opacity: 1; } }
  .sheet-handle { width: 40px; height: 4px; border-radius: 999px; background: rgba(61,43,68,0.18); margin: 0 auto 16px; }

  /* Toast */
  .toast-root {
    position: fixed; left: 16px; right: 16px; bottom: calc(var(--nav-h) + 16px);
    z-index: 120; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
  }
  .toast {
    background: var(--plum); color: #fff; padding: 10px 18px; border-radius: 999px;
    font-size: 13px; font-weight: 600; box-shadow: 0 10px 28px rgba(61,43,68,0.28);
    pointer-events: auto; animation: toastIn .22s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  @keyframes toastIn { from { transform: translateY(10px) scale(0.96); opacity: 0; } to { transform: none; opacity: 1; } }

  /* Form controls */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .label { font-size: 12px; font-weight: 700; color: var(--plum-soft); text-transform: uppercase; letter-spacing: 0.04em; }
  .input {
    min-height: 44px; padding: 0 14px; border-radius: var(--r-sm); border: 1.5px solid var(--line);
    background: #fff; color: var(--plum); font-size: 14.5px; transition: border-color .15s ease;
  }
  .input:focus { border-color: var(--lavender-500); outline: none; }
  textarea.input { padding: 10px 14px; min-height: 72px; resize: vertical; }

  /* Quick chips */

  function loadState() {
    const saved = Store.get();
    if (saved && saved.profile && saved.days) {
      state = saved;
      if (!state.ui) state.ui = { view: "home", mealsDay: todayKey(), mealsFilter: "all", progressRange: "week", deviceFrame: false };
      if (!state.weights) state.weights = [];
      // Clean up legacy states if any
    } else {
      seedSampleData();
      saveNow();
    }

  let saveTimer = null;
  function save() {
    if (saveTimer) return;
    saveTimer = setTimeout(() => { saveTimer = null; saveNow(); }, 250);
  }
  function saveNow() {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    Store.set(state);
  }

  function getDay(key) {
    if (!state.days[key]) state.days[key] = blankDay();
    return state.days[key];
  }

  /* =========================================================
     Calculations & Metrics
     ========================================================= */
  function mealsPlannedFor(key) {
    // 5 planned meal categories per day
    return MEAL_SLOTS.length;
  }
  function mealsEaten(key) {
    const d = getDay(key);
    return MEAL_SLOTS.filter((s) => d.meals[s.key] && d.meals[s.key].eaten).length;
  }
  function mealPct(key) {
    const planned = mealsPlannedFor(key);
    return planned > 0 ? clamp(mealsEaten(key) / planned, 0, 1) : 0;
  }

  function walkMinutes(key) {
    const d = getDay(key);
    return (d.walks.lunch.minutes || 0) + (d.walks.evening.minutes || 0);
  }
  function walkPct(key) {
    return clamp(walkMinutes(key) / state.profile.walkDailyGoal, 0, 1);
  }
  function waterPct(key) {
    return clamp(getDay(key).water / state.profile.waterGlasses, 0, 1);
  }
  function sleepHoursFor(key) {
    const s = getDay(key).sleep;
    if (!s || !s.bed || !s.wake) return null;
    const [bh, bm] = s.bed.split(":").map(Number);
    const [wh, wm] = s.wake.split(":").map(Number);
    let min = (wh * 60 + wm) - (bh * 60 + bm);
    if (min < 0) min += 1440;
    return round1(min / 60);
  }

  function lastWalkEnd(walkObj) {
    if (!walkObj || !walkObj.sessions || !walkObj.sessions.length) return null;
    return walkObj.sessions[walkObj.sessions.length - 1].end;
  }

  function habitsFor(key) {
    const d = getDay(key);
    const goal = state.profile.walkSessionGoal;
    return {
      breakfast: { done: !!d.meals.breakfast.eaten, at: d.meals.breakfast.at, food: d.meals.breakfast.food },
      lunch: { done: !!d.meals.lunch.eaten, at: d.meals.lunch.at, food: d.meals.lunch.food },
      snack: { done: !!d.meals.snack.eaten, at: d.meals.snack.at, food: d.meals.snack.food },
      dinner: { done: !!d.meals.dinner.eaten, at: d.meals.dinner.at, food: d.meals.dinner.food },
      walkLunch: { done: (d.walks.lunch.minutes || 0) >= goal, at: lastWalkEnd(d.walks.lunch) },
      walkEvening: { done: (d.walks.evening.minutes || 0) >= goal, at: lastWalkEnd(d.walks.evening) },
      water: { done: d.water >= state.profile.waterGlasses && d.water > 0, at: null },
      sleep: { done: !!d.sleep.routine, at: d.sleep.at },
    };
  }
  function completedHabits(key) {
    const h = habitsFor(key);
    return HABITS.filter((item) => h[item.key].done).length;
  }
  function habitPct(key) {
    return clamp(completedHabits(key) / HABITS.length, 0, 1);
  }

  function overallPct(key) {
    const m = mealPct(key);
    const w = walkPct(key);
    const h = waterPct(key);
    const b = habitPct(key);
    return (m + w + h + b) / 4;
  }

  function strideMeters() {
    if (state.profile.heightCm) return (state.profile.heightCm * 0.415) / 100;
    return 0.72;
  }
  function distanceKm(key) {
    const d = getDay(key);
    if (d.steps != null && d.steps > 0) {
      return (d.steps * strideMeters()) / 1000;
    }
    const mins = walkMinutes(key);
    if (mins > 0) return mins * 0.08; // ~80m per min moderate walking
    return 0;
  }
  function distanceIsMeasured(key) {
    const d = getDay(key);
    return d.steps != null && d.steps > 0;
  }
  function weightForCalc() {
    return state.profile.weightKg || 68;
  }
  function kcalBurned(key) {
    const mins = walkMinutes(key);
    if (mins <= 0) return 0;
    return 3.3 * weightForCalc() * (mins / 60);
  }
  function kcalIsEstimated() {
    return true;
  }

  function motivationalMessage(key) {
    const p = overallPct(key);
    const w = walkMinutes(key);
    const d = getDay(key);
    if (p >= 0.95) return "A complete, beautifully balanced day. You honored your body with gentle consistency! 💗";
    if (p >= 0.75) return "You're doing wonderfully. A short evening walk or quiet tea will round out a lovely day.";
    if (p >= 0.5) return "Halfway is a powerful place to be. Every steady, calm choice is moving you forward.";
    if (w >= 30) return "You've already walked 30 minutes today! Your post-meal walk does wonders for glucose calm.";
    if (d.meals.breakfast.eaten && d.meals.lunch.eaten) return "Two steady, nourishing meals logged today. Keep this relaxed momentum.";
    if (p >= 0.25) return "A gentle start. Choose one kind thing for yourself next — no rush, just one.";
    return "Every wellness journey begins with one small step. Take a deep breath and start gently. 💗";
  }

  function icon(name, size) {
    const s = size || 18;
    const body = ICONS[name] || ICONS.sparkle;
    return `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
  }

  function ringSvg(pct, opts) {
    const p = clamp(pct, 0, 1);
    const size = opts.size || 64;
    const stroke = opts.stroke || 7;
    const r = (size - stroke) / 2;
    const c = 2 * Math.PI * r;
    const offset = c * (1 - p);
    const color = opts.color || "var(--blush-500)";
    const label = opts.label || "Progress ring";
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${label}">
      <circle class="ring-bg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}" />
      <circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}" stroke="${color}"
        stroke-dasharray="${c}" stroke-dashoffset="${offset}" />
    </svg>`;
  }

  function ringBlock(pct, opts) {
    const p = clamp(pct, 0, 1);
    const big = opts.big || `${Math.round(p * 100)}%`;
    const sub = opts.sub || "";
    return `<div class="ring-wrap" style="width:${opts.size}px;height:${opts.size}px">
      ${ringSvg(p, opts)}
      <div class="ring-center">
        <div class="ring-val">${big}</div>
        ${sub ? `<div class="ring-lab">${sub}</div>` : ""}
      </div>
    </div>`;
  }

  function dayLabel(key) {
    const d = parseISO(key);
    return `${DAY_NAMES[dayIndex(d)]}, ${fmtDateShort(d)}`;
  }

  function sourceBadge(text, kind) {
    return `<span class="pill ${kind || "plain"}" style="font-size:10px;padding:2px 7px">${text}</span>`;
  }

     Navigation
     ========================================================= */
  const NAV_ITEMS = [
    { id: "home", label: "Home", icon: "home" },
    { id: "meals", label: "Meal Plan", icon: "meal" },
    { id: "walk", label: "Walk", icon: "walk" },
    { id: "progress", label: "Progress", icon: "chart" },
    { id: "profile", label: "Profile", icon: "user" },
  ];

  function renderNav() {
    const cur = state.ui.view;
    const key = todayKey();
    const incompleteHabits = HABITS.length - completedHabits(key);
    const aw = getActive();

    const tabsHtml = NAV_ITEMS.map((item) => {
      const active = item.id === cur;
      let badge = "";
      if (item.id === "walk" && aw && aw.running) badge = '<span class="tab-badge" style="background:var(--sage-500)"></span>';
      else if (item.id === "home" && incompleteHabits > 0 && incompleteHabits < HABITS.length) badge = '<span class="tab-badge"></span>';

      return `<button class="tab" role="tab" aria-selected="${active}" aria-current="${active ? "page" : "false"}"
        data-nav="${item.id}" aria-label="${item.label}">
        ${icon(item.icon, 22)}
        <span>${item.label}</span>
        ${badge}
      </button>`;
    }).join("");

    const snavHtml = NAV_ITEMS.map((item) => {
      const active = item.id === cur;
      return `<button data-nav="${item.id}" aria-current="${active ? "page" : "false"}">
        ${icon(item.icon, 20)}
        <span>${item.label}</span>
      </button>`;
    }).join("");

    $("#tabbar").innerHTML = tabsHtml;
    $("#snav").innerHTML = snavHtml;
  }

  function go(viewId) {
    if (!viewId || state.ui.view === viewId) return;
    state.ui.view = viewId;
    save();
    renderCurrent();
    renderNav();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function renderCurrent() {
    $$(".view").forEach((v) => v.classList.remove("active"));
    const cur = state.ui.view || "home";
    const el = $("#view-" + cur);
    if (el) el.classList.add("active");

    switch (cur) {
      case "home": renderHome(); break;
      case "meals": renderMeals(); break;
      case "walk": renderWalk(); break;
      case "progress": renderProgress(); break;
      case "profile": renderProfile(); break;
    }
  }

  function elapsedOf(aw) {
    if (!aw) return 0;
    let ms = aw.accumulatedMs || 0;
    if (aw.running && aw.runStartedAt) ms += Date.now() - aw.runStartedAt;
    return Math.max(0, ms);
  }
  function getActive() {
    return state.days[todayKey()] ? state.days[todayKey()].active : null;
  }

            <div style="font-size:13px;color:var(--plum-soft)">${done ? "Session goal reached! Extra walks still count." : mins > 0 ? `${goal - mins} minutes left to meet session goal.` : "30-minute steady walk after your meal."}</div>
          </div>
          <div class="row" style="gap:8px">
            <button class="btn btn-sage btn-sm" data-action="walk-start" data-walk="${type}">
              ${icon("play", 14)} ${done ? "Walk Again" : meta.start}

  function renderHome() {
    const key = todayKey();
    const d = getDay(key);
    const p = overallPct(key);
    const wkStart = startOfWeek(today());
    const dayNo = Math.round((today() - wkStart) / 86400000) + 1;
    const mins = walkMinutes(key);
    const steps = d.steps;

    const mealsPct = mealPct(key);
    const wPct = walkPct(key);
    const hPct = waterPct(key);
    const habPct = habitPct(key);

    const stepMetric = steps != null
      ? `<div class="stat-val">${steps.toLocaleString()}<small> steps</small></div>
         <div class="stat-note">${d.stepsSource === "manual" ? sourceBadge("Manual entry", "lav") : d.stepsSource === "pedometer" ? sourceBadge("Phone sensor", "sage") : sourceBadge("Sample data", "plain")}</div>`
      : `<div class="stat-val" style="font-size:13.5px;color:var(--plum-faint);font-weight:600">Not connected</div>
         <div class="stat-note"><button class="btn btn-ghost btn-sm" style="min-height:28px;padding:0 8px;font-size:11px" data-action="connect-tracker">Connect</button>

  function renderWalk() {
    const key = todayKey();
    const d = getDay(key);
    const aw = getActive();
    const goal = state.profile.walkSessionGoal;

    const sessionCard = (type) => {
      const meta = WALK_TYPES[type];
      const w = d.walks[type];
      const mins = w.minutes || 0;
      const done = mins >= goal;
      const isActive = aw && aw.type === type;

      if (isActive) {
        const el = elapsedOf(aw);
        const livePct = clamp(el / 60000 / goal, 0, 1);
        return `<div class="card tint-sage" style="border:1.5px solid var(--sage-500);margin-bottom:14px">
          <div class="card-head">
            <div>
              <div class="card-title">${meta.label} · in progress</div>
              <div class="card-sub">Goal ${goal} minutes · ${aw.running ? "timer active" : "paused"}</div>
            </div>
            <span class="pill sage">${aw.running ? "Live Timer" : "Paused"}</span>
          </div>
          <div class="row" style="gap:20px;align-items:center;flex-wrap:wrap">
            <div class="ring-wrap live-walk-ring" style="width:100px;height:100px">

                </button>
                <button class="btn btn-primary btn-sm" data-action="walk-stop">
                  ${icon("stop", 15)} Stop Walk
                </button>
              </div>
            </div>
          </div>
        </div>`;
      }

      return `<div class="card ${done ? "tint-sage" : ""}" style="margin-bottom:14px">

  function weightSparkline(weights) {
    const pts = weights.slice(-8);
    if (pts.length < 2) {
      return `<div class="empty" style="padding:14px;text-align:center;color:var(--plum-faint)">Record at least 2 entries to see your trend curve.</div>`;
    }
    const vals = pts.map((p) => p.kg);
    const min = Math.min(...vals) - 0.4;
    const max = Math.max(...vals) + 0.4;
    const w = 280, h = 64, pad = 8;
    const coords = pts.map((p, i) => {
      const x = pad + (i / (pts.length - 1)) * (w - pad * 2);
      const y = h - pad - ((p.kg - min) / (max - min || 1)) * (h - pad * 2);
      return [x, y];
    });
    const d = coords.map((c, i) => (i === 0 ? `M ${c[0]} ${c[1]}` : `L ${c[0]} ${c[1]}`)).join(" ");
    return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible">
      <path d="${d}" fill="none" stroke="var(--plum)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      ${coords.map((c) => `<circle cx="${c[0]}" cy="${c[1]}" r="4" fill="var(--blush-500)" stroke="#fff" stroke-width="2" />`).join("")}
    </svg>`;
  }

  /* =========================================================
     Walking Timer Loop
     ========================================================= */
  let timerId = null;
  function startTimerLoop() {
    if (timerId) return;
    timerId = setInterval(() => {
      const aw = getActive();
      if (!aw) { stopTimerLoop(); return; }
      const elapsed = elapsedOf(aw);

      // Update all live walk timers across Home and Walk screens
      $$(".live-walk-timer").forEach((el) => {
        el.textContent = fmtClock(elapsed);
      });

      // Update live circular progress rings
      const goal = state.profile.walkSessionGoal || 30;
      const pct = clamp(elapsed / 60000 / goal, 0, 1);
      $$(".live-walk-ring").forEach((ringWrap) => {
        const ring = ringWrap.querySelector("circle:nth-of-type(2)");
        if (ring) {
          const size = parseFloat(ringWrap.style.width) || 100;
          const stroke = ring.getAttribute("stroke-width") ? parseFloat(ring.getAttribute("stroke-width")) : 10;
          const r = (size - stroke) / 2;
          const c = 2 * Math.PI * r;
          ring.setAttribute("stroke-dashoffset", String(c * (1 - pct)));
        }
        const pctEl = ringWrap.querySelector(".live-walk-pct");
        if (pctEl) pctEl.textContent = Math.round(pct * 100) + "%";
      });
    }, 1000);
  }

  function stopTimerLoop() {
    if (timerId) { clearInterval(timerId); timerId = null; }
  }

     ========================================================= */
  let lastFocus = null;
  function openModal(opts) {
    lastFocus = document.activeElement;
    const root = $("#modal-root");
    root.innerHTML = `
      <div class="modal-backdrop" data-modal-backdrop="true" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="sheet">
          <div class="sheet-handle" aria-hidden="true"></div>
          <div style="margin-bottom:14px">
            <h2 id="modalTitle" style="font-size:18px;font-weight:800;letter-spacing:-.02em">${escapeHtml(opts.title || "")}</h2>
            ${opts.sub ? `<div class="card-sub" style="margin-top:3px">${escapeHtml(opts.sub)}</div>` : ""}
          </div>
          <div class="modal-content">${opts.body || ""}</div>
          <div class="actions" style="margin-top:18px;justify-content:flex-end">
            ${(opts.actions || [{ label: "Close", kind: "btn-primary" }]).map((a, i) => `
              <button class="btn ${a.kind || "btn-soft"} btn-sm" data-modal-action="${i}">${escapeHtml(a.label)}</button>
            `).join("")}
          </div>
        </div>
      </div>
    `;

    root.querySelectorAll("[data-modal-action]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const idx = Number(btn.getAttribute("data-modal-action"));
        const act = (opts.actions || [])[idx];
        if (act && typeof act.onClick === "function") {
          const keepOpen = act.onClick();
          if (keepOpen === true) return;
        }
        closeModal();
      });
    });

    const first = root.querySelector("button, input, select, textarea");
    if (first) first.focus();
    document.addEventListener("keydown", onModalKeydown);
  }

  function onModalKeydown(e) {
    if (e.key === "Escape") closeModal();
  }
  function closeModal() {
    $("#modal-root").innerHTML = "";
    document.removeEventListener("keydown", onModalKeydown);
    if (lastFocus && typeof lastFocus.focus === "function") lastFocus.focus();
  }

  function toast(msg) {
    const root = $("#toast-root");
    const t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    root.appendChild(t);
    setTimeout(() => {
      t.style.transition = "opacity 0.25s ease, transform 0.25s ease";
      t.style.opacity = "0";
      t.style.transform = "translateY(8px)";
      setTimeout(() => t.remove(), 260);
    }, 2400);
  }

  /* =========================================================
     Walking Actions
     ========================================================= */
  function startWalk(type) {
    const d = getDay(todayKey());
    if (d.active) {
      toast("A walk session is already in progress!");
      return;
    }
    d.active = {
      type,
      startedAt: Date.now(),
      accumulatedMs: 0,
      running: true,
      runStartedAt: Date.now(),
    };
    saveNow();
    startTimerLoop();
    renderCurrent();
    renderNav();
    toast(WALK_TYPES[type].label + " timer started! 🚶‍♀️");
  }

  function toggleWalk() {
    const aw = getActive();
    if (!aw) return;
    if (aw.running) {
      aw.accumulatedMs = elapsedOf(aw);
      aw.running = false;
      aw.runStartedAt = null;
      stopTimerLoop();
      toast("Walk timer paused");
    } else {
      aw.running = true;
      aw.runStartedAt = Date.now();
      startTimerLoop();
      toast("Walk timer resumed");
    }
    saveNow();
    renderCurrent();
  }

  function stopWalk() {
    const aw = getActive();
    if (!aw) return;
    const elapsed = elapsedOf(aw);
    const minutes = Math.max(1, Math.round(elapsed / 60000));
    const goal = state.profile.walkSessionGoal;
    const type = aw.type;

    openModal({
      title: "Save walking session?",
      sub: `${WALK_TYPES[type].label} · ${dayLabel(todayKey())}`,
      body: `
        <div style="text-align:center;padding:10px 0 16px">
          <div class="timer lg" style="font-size:42px">${fmtClock(elapsed)}</div>
          <div class="hint" style="margin-top:6px;font-size:13.5px"><strong>${minutes} minute${minutes === 1 ? "" : "s"}</strong> walked of your ${goal}-minute goal</div>
        </div>
        <div class="stats-3">
          <div class="stat"><div class="stat-lab">Start time</div><div class="stat-val" style="font-size:15px">${fmtTime(aw.startedAt)}</div></div>
          <div class="stat"><div class="stat-lab">Duration</div><div class="stat-val" style="font-size:15px">${minutes} min</div></div>
          <div class="stat"><div class="stat-lab">Session status</div><div class="stat-val" style="font-size:15px">${minutes >= goal ? "Goal Met ✓" : "Partial"}</div></div>
        </div>

          ${minutes >= goal
            ? "Wonderful! You met your 30-minute session goal. These minutes are credited to your daily total."

      `,
      actions: [
        { label: "Keep walking", kind: "btn-soft" },
        { label: "Save session & confirm", kind: "btn-sage", onClick: () => saveSession(type, minutes, elapsed) },
        { label: "Discard walk", kind: "btn-danger", onClick: () => confirmDiscard() },
      ],
    });

    function saveSession(tType, mins, totalMs) {
      const rec = getDay(todayKey());
      const end = Date.now();
      rec.walks[tType].sessions.push({
        id: uid(),
        date: todayKey(),
        start: aw.startedAt,
        end,
        minutes: mins,
        complete: mins >= state.profile.walkSessionGoal,
      });
      rec.walks[tType].minutes = rec.walks[tType].sessions.reduce((a, s) => a + s.minutes, 0);
      rec.active = null;
      stopTimerLoop();
      saveNow();
      renderCurrent();
      renderNav();
      toast(`Walk session confirmed! +${mins} min credited ✓`);

    function confirmDiscard() {
      setTimeout(() => {

  /* =========================================================
     Habit Toggling Action (from Checklist)
     ========================================================= */
  function toggleHabit(habitKey) {
    const key = todayKey();
    const d = getDay(key);
    const goal = state.profile.walkSessionGoal;

    switch (habitKey) {
      case "breakfast":
      case "lunch":
      case "snack":
      case "dinner": {
        const next = !d.meals[habitKey].eaten;
        d.meals[habitKey].eaten = next;
        d.meals[habitKey].at = next ? Date.now() : null;
        toast(next ? `${HABITS.find((h) => h.key === habitKey).label} marked! 💗` : "Meal marked as not eaten");
        break;
      }
      case "walkLunch": {
        const isDone = (d.walks.lunch.minutes || 0) >= goal;
        if (!isDone) {
          d.walks.lunch.minutes = goal;
          d.walks.lunch.sessions.push({
            id: uid(), date: key, start: Date.now() - goal * 60000, end: Date.now(),
            minutes: goal, complete: true,
          });
          toast("Lunch walk marked complete (30m) 🚶‍♀️");
        } else {
          d.walks.lunch.minutes = 0;
          d.walks.lunch.sessions = [];
          toast("Lunch walk unchecked");
        }
        break;
      }
      case "walkEvening": {
        const isDone = (d.walks.evening.minutes || 0) >= goal;
        if (!isDone) {
          d.walks.evening.minutes = goal;
          d.walks.evening.sessions.push({
            id: uid(), date: key, start: Date.now() - goal * 60000, end: Date.now(),
            minutes: goal, complete: true,
          });
          toast("Evening walk marked complete (30m) 🚶‍♀️");
        } else {
          d.walks.evening.minutes = 0;
          d.walks.evening.sessions = [];
          toast("Evening walk unchecked");
        }
        break;
      }
      case "water": {
        const isDone = d.water >= state.profile.waterGlasses && d.water > 0;
        if (!isDone) {
          d.water = state.profile.waterGlasses;
          toast("Daily water goal reached! 💧");
        } else {
          d.water = 0;
          toast("Water goal unchecked");
        }
        break;
      }
      case "sleep": {
        d.sleep.routine = !d.sleep.routine;
        d.sleep.at = d.sleep.routine ? Date.now() : null;
        toast(d.sleep.routine ? "Sleep routine marked! 🌙" : "Sleep routine unchecked");
        break;
      }
    }

    saveNow();
    renderCurrent();
    renderNav();
  }

  function enableLiveMotionSensor() {
    if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
      DeviceMotionEvent.requestPermission().then((res) => {
        if (res === "granted") startMotionListening();
        else toast("Motion permission denied");
      }).catch((e) => toast("Motion sensor not accessible here"));
    } else if (window.DeviceMotionEvent) {
      startMotionListening();
    } else {
      toast("Device motion is not supported in this browser environment. Use Manual Entry or Sync!");
    }
  }

  function startMotionListening() {
    liveMotionActive = true;
    const d = getDay(todayKey());
    if (d.steps == null) d.steps = 0;
    d.stepsSource = "pedometer";
    saveNow();

    window.addEventListener("devicemotion", (e) => {
      const acc = e.accelerationIncludingGravity || e.acceleration;
      if (!acc) return;
      const mag = Math.sqrt((acc.x || 0)**2 + (acc.y || 0)**2 + (acc.z || 0)**2);
      const delta = mag - lastAccMagnitude;
      lastAccMagnitude = mag;
      if (delta > 3.2) {
        const rec = getDay(todayKey());
        rec.steps = (rec.steps || 0) + 1;
        save();
      }
    });

    const statusEl = $("#motionStatus");
    if (statusEl) statusEl.textContent = "Sensor active! Shake or walk with device to count steps.";
    toast("Live phone pedometer activated! 🚶‍♀️");
  }

      sub: `${dayLabel(key)} · Record any food, extra snack or drink`,
      body: `
        <div class="label" style="margin-bottom:6px">Quick food ideas or type below</div>
        <div class="chip-group" style="margin-bottom:12px" id="snackChips">
          ${SNACK_SUGGESTIONS.map((s) => `<button class="chip" data-sname="${escapeAttr(s.name)}" data-sport="${escapeAttr(s.portion)}">${s.name}</button>`).join("")}
        </div>

        <div class="field" style="margin-bottom:12px">
          <label class="label" for="m-food">Food or drink name</label>
          <input class="input" id="m-food" placeholder="e.g. 3 rotis and bhindi sabzi, green tea, buttermilk">
        </div>
        <div class="field" style="margin-bottom:12px">
          <label class="label" for="m-portion">Quantity or portion</label>
          <input class="input" id="m-portion" placeholder="e.g. 1 bowl, 2 pieces, 250 ml">
        </div>
        <div class="field" style="margin-bottom:12px">
          <label class="label" for="m-slot">Category</label>
          <select class="input" id="m-slot">
            <option value="snack">Evening snack</option>
            <option value="extra">Extra snack / drink</option>
            <option value="breakfast">Breakfast</option>
            <option value="lunch">Lunch</option>
            <option value="dinner">Dinner</option>
          </select>
        </div>
        <div class="field">
          <label class="label" for="m-note">Notes (optional)</label>
          <input class="input" id="m-note" placeholder="e.g. Felt energized, homemade, restaurant plate">
        </div>
      `,
      actions: [
        { label: "Cancel", kind: "btn-soft" },
        {
          label: "Save to diary", kind: "btn-blush", onClick: () => {
            const name = $("#m-food").value.trim();
            if (!name) { toast("Please enter a food name"); return true; }
            d.foods.push({
              id: uid(),
              name,
              portion: $("#m-portion").value.trim(),
              slot: $("#m-slot").value,
              note: $("#m-note").value.trim(),
              at: Date.now(),
            });
            saveNow();
            renderMeals();
            toast("Added to food diary ✓");
          },
        },
      ],
    });

    $$("#snackChips .chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        $("#m-food").value = chip.getAttribute("data-sname");
        $("#m-portion").value = chip.getAttribute("data-sport");
        $$("#snackChips .chip").forEach((c) => c.classList.remove("active"));
        chip.classList.add("active");
      });
    });
  }

  /* =========================================================
     Weight & Data Management
     ========================================================= */
  function openLogWeight() {
    openModal({
      title: "Record weight (optional)",
      sub: "Log only if helpful · habits matter more than scale numbers",
      body: `
        <div class="field" style="margin-bottom:12px">
          <label class="label" for="w-kg">Weight (kg)</label>
          <input class="input" id="w-kg" type="number" step="0.1" value="${state.profile.weightKg || 73.5}">
        </div>
        <div class="field">
          <label class="label" for="w-date">Date</label>
          <input class="input" id="w-date" type="date" value="${todayKey()}">
        </div>
        <div class="hint" style="margin-top:10px">Normal hydration and hormonal shifts cause weight to fluctuate daily. Focus on your steady routines!</div>
      `,
      actions: [
        { label: "Cancel", kind: "btn-soft" },
        {
          label: "Save entry", kind: "btn-primary", onClick: () => {
            const kg = Number($("#w-kg").value);
            const date = $("#w-date").value;
            if (kg > 20 && date) {
              state.weights = state.weights.filter((w) => w.date !== date);
              state.weights.push({ date, kg });
              state.weights.sort((a, b) => a.date.localeCompare(b.date));
              state.profile.weightKg = kg;
              saveNow();
              renderCurrent();
              toast("Weight logged gently ✓");
            }
          },
        },
      ],
    });
  }

  function exportData() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
    const dlAnchor = document.createElement("a");
    dlAnchor.setAttribute("href", dataStr);
    dlAnchor.setAttribute("download", `my-pcos-journey-${todayKey()}.json`);
    document.body.appendChild(dlAnchor);
    dlAnchor.click();
    dlAnchor.remove();
    toast("Data exported as JSON");
  }

  function resetData() {
    openModal({
      title: "Reset all application data?",
      sub: "Clear all saved records and start fresh",
      body: `
        <div class="card tint-lav" style="padding:14px;color:var(--plum-soft)">
          This will reset all your customized meals, walks, water and profile preferences, and restore a clean, empty food diary.
        </div>
      `,
      actions: [
        { label: "Cancel", kind: "btn-soft" },
        {
          label: "Yes, Reset All Data", kind: "btn-danger", onClick: () => {
            Store.clear();
            seedSampleData();
            saveNow();
            renderCurrent();
            renderNav();
            toast("All data reset to fresh clean start");
          },
        },
      ],
    });
  }

  /* =========================================================
     Escaping Helpers
     ========================================================= */
  function escapeHtml(s) {
    if (s == null) return "";
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }
  function escapeAttr(s) {
    return escapeHtml(s);
  }

  /* =========================================================
     Global Delegated Event Listeners
     ========================================================= */
  document.addEventListener("click", (e) => {
    // Navigation
    const nav = e.target.closest("[data-nav]");
    if (nav) { go(nav.getAttribute("data-nav")); return; }

    const el = e.target.closest("[data-action]");
    if (!el) return;
    const act = el.getAttribute("data-action");

    switch (act) {
      case "toggle-habit": toggleHabit(el.getAttribute("data-habit")); break;
      case "open-edit-meal": openEditMeal(el.getAttribute("data-slot")); break;
      case "toggle-meal-eaten": toggleMealEaten(el.getAttribute("data-slot")); break;
      case "fill-suggestion": fillSuggestion(el.getAttribute("data-slot")); break;
      case "select-day": selectDay(el.getAttribute("data-day")); break;
      case "filter-meals": {
        state.ui.mealsFilter = el.getAttribute("data-filter");
        save(); renderMeals(); break;
      }
      case "water-plus": addWater(1); break;
      case "water-minus": addWater(-1); break;
      case "walk-start": startWalk(el.getAttribute("data-walk")); break;
      case "walk-toggle": toggleWalk(); break;
      case "walk-stop": stopWalk(); break;
      case "walk-detail": walkDetail(el.getAttribute("data-walk")); break;
      case "connect-tracker": openConnectTracker(); break;
      case "manual-steps": openManualSteps(); break;
      case "log-sleep": openLogSleep(); break;
      case "quick-log-meal": openQuickLogMeal(); break;
      case "delete-food": {
        const key = state.ui.mealsDay || todayKey();
        const d = getDay(key);
        d.foods = d.foods.filter((f) => f.id !== el.getAttribute("data-id"));
        saveNow(); renderMeals(); toast("Food item removed");
        break;
      }
      case "range": {
        state.ui.progressRange = el.getAttribute("data-range");
        save(); renderProgress(); break;
      }
      case "log-weight": openLogWeight(); break;
      case "load-sample-meals": loadDemoSampleMeals(); break;
      case "export-data": exportData(); break;
      case "reset-data": resetData(); break;
    }
  });

  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.matches("[data-habit='sleep']")) {
      const d = getDay(todayKey());
      d.sleep.routine = t.checked;
      d.sleep.at = t.checked ? Date.now() : null;
      saveNow(); renderCurrent(); renderNav();
      toast(t.checked ? "Sleep routine marked!" : "Sleep routine unchecked");
      return;
    }
    if (t.matches("[data-notif]")) {
      state.profile.notifications[t.getAttribute("data-notif")] = t.checked;
      saveNow();
      return;
    }
    if (t.matches("[data-profile-toggle='hideWeight']")) {
      state.profile.privacy.hideWeight = t.checked;
      saveNow();
      return;
    }
    if (t.matches("[data-profile]")) {
      const key = t.getAttribute("data-profile");
      if (["weightKg", "heightCm", "walkDailyGoal", "walkSessionGoal", "waterGlasses", "sleepGoal"].indexOf(key) !== -1) {
        state.profile[key] = Number(t.value) || 0;
      } else {
        state.profile[key] = t.value;
      }
      saveNow();
      return;
    }
  });

  document.addEventListener("mousedown", (e) => {
    if (e.target.matches("[data-modal-backdrop]")) closeModal();
  });

  // Device frame preview toggle on desktop
  const btnDevice = $("#btnDeviceToggle");
  if (btnDevice) {
    btnDevice.addEventListener("click", () => {
      document.body.classList.toggle("device-preview");
      const isDev = document.body.classList.contains("device-preview");
      $("#deviceToggleLabel").textContent = isDev ? "Responsive View" : "Mobile Frame";
      toast(isDev ? "Switched to Mobile Phone Frame preview" : "Switched to Responsive Desktop layout");
    });
  }

  /* =========================================================
     Initialization
     ========================================================= */
  function init() {
    loadState();
    renderNav();
    renderCurrent();
    if (getActive()) startTimerLoop();
  }

  // Run on DOM ready
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();

</script>
</body>
</html>
